[package]
name = "paperbanana"
version = "0.1.0"
description = "PaperBanana - Automated Academic Illustration Generation"
authors = ["PaperBanana Team"]
edition = "2021"

[lib]
name = "paperbanana_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
